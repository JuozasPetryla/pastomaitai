services:
  postgres:
    image: postgres:16-alpine
    container_name: pastomatai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pastomatai}
      POSTGRES_USER: ${POSTGRES_USER:-pastomatai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pastomatai}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pastomatai} -d ${POSTGRES_DB:-pastomatai}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
